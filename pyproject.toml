[project]
name = "groundtruth-benchmarking-geology"
version = "1.0.0"
description = "Groundtruth Dynamic Benchmarking (Geology Edition) — benchmark harness for evaluating fine-tuned geology LLMs against a baseline using an LLM judge"
readme = "README.md"
license = "MIT"
authors = [{ name = "Eigenform AI" }]
requires-python = ">=3.12"
dependencies = [
    "requests>=2.34.2",
    "python-dotenv>=1.2.2",
    "gspread>=6.2.1",
    "google-auth>=2.55.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.17",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# Line length is owned by `ruff format`; what it can't wrap (long string
# literals in help texts / log messages) is accepted as-is.
ignore = ["E501"]
